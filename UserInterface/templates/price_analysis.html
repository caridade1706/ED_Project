<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Evolution of E-Commerce Websites in Portugal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <h1>Tracking Evolution of E-Commerce Websites in Portugal</h1>
    </div>

    <!-- Navigation Banner -->
    <div class="banner-nav">
        <nav>
            <ul class="banner-nav-list">
                <li><a href="/">Overview</a></li>
                <li><a href="/price-analysis">Price Analysis</a></li>
                <li><a href="/categories">Categories</a></li>
                <li><a href="/productComparisons">Product Compare</a></li>
                <li><a href="/priceAnomalies">Price Anomalies</a></li>
            </ul>
        </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container" id="price-analysis">
        <div class="filters-grid">
            
            <div class="filter-card">
                <i class="fas fa-th-list"></i>
                <select id="categoryFilter">
                    <option value="all">All</option>
                </select>
            </div>
    
            <!-- Website Filter -->
            <div class="filter-card">
                <i class="fas fa-globe"></i>
                <select id="websiteFilter">
                    <option value="all">All</option>
                </select>
            </div>
    
            <!-- Date Range Filters -->
            <div class="filter-card">
                <label for="startDate">
                    <i class="fas fa-calendar-alt"></i> Initial Date:
                </label>
                <input type="datetime-local" id="startDate" />
            </div>
            <div class="filter-card">
                <label for="endDate">
                    <i class="fas fa-calendar-alt"></i> Final Date:
                </label>
                <input type="datetime-local" id="endDate" />
            </div>
        </div>

        <div>
            <canvas id="priceChart" style="width:100%; height:400px;"></canvas>
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer">
        <p>Exploração de Dados</p>
        <a>Roberto Rolão de Castro - 107133 e</a>
        <a>Tiago Caridade Gomes - 107133</a>
        <p>© 2024</p>
    </footer>
</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.2.1/dist/chart.umd.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<script src="/static/scripts/price-analysis.js"></script>

</html>
