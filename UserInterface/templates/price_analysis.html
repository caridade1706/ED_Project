<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Evolution of E-Commerce Websites in Portugal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <h1>Tracking Evolution of E-Commerce Websites in Portugal</h1>
    </div>

    <!-- Navigation Banner -->
    <div class="banner-nav">
        <nav>
            <ul class="banner-nav-list">
                <li><a href="/">Overview</a></li>
                <li><a href="/price-analysis">Price Analysis</a></li>
                <li><a href="/categories">Categories</a></li>
                <li><a href="/comparisons">Compare</a></li>
            </ul>
        </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container" id="price-analysis">
        <h2>Filters</h2>
        <div>
            <!-- Dropdown para selecionar categoria -->
            <label for="categoryFilter">Select the Category:</label>
            <select id="categoryFilter">
                <option value="all">All</option>
            </select>
        </div>
        <div>
            <!-- Dropdown para selecionar website -->
            <label for="websiteFilter">Select the Website:</label>
            <select id="websiteFilter">
                <option value="all">All</option>
            </select>
        </div>

        <div>
            <!-- Campos de data para filtrar -->
            <label for="startDate">Initial Date:</label>
            <input type="date" id="startDate" />
            <label for="endDate">Final Date:</label>
            <input type="date" id="endDate" />
        </div>

        <h2>Gráficos</h2>
        <div>
            <canvas id="priceChart" style="width:100%; height:400px;"></canvas>
        </div>
        <div>
            <canvas id="categoryChart" style="width:100%; height:400px;"></canvas>
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer">
        <div class="ctn-footer">

        </div>
        <p>Exploração de Dados<br><a>Roberto Rolão de Castro - 107133</a>
            <br><a>Tiago Caridade Gomes - 107133</a> <br>© 2024
        </p>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.2.1/dist/chart.umd.js"></script>
<script src="/static/scripts/price-analysis.js"></script>

</html>
